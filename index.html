<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Cookie POS</title>
  <meta name="description" content="ระบบขายหน้าร้าน (POS) สำหรับ iPad ทำงานแบบออฟไลน์ได้ 100%" />
  <meta name="theme-color" content="#862d28" />

  <!-- iOS / iPadOS standalone (Add to Home Screen) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cookie POS" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Thai-friendly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" />

  <!-- Tailwind (utility helpers). Preflight disabled: styles.css is the source of truth so the UI looks identical offline. -->
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      corePlugins: { preflight: false },
      theme: { extend: { colors: { burgundy: '#862d28', cream: '#f7f0dd', panel: '#fffdf9', espresso: '#2b1e1c', soldout: '#c4bdb3' } } }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- ================= TOP BAR ================= -->
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="./icons/logo-mascot.png" alt="โลโก้ร้าน" />
        <div class="brand-text">
          <div class="brand-name" id="shopName">Cookie POS</div>
          <div class="brand-sub">ระบบขายหน้าร้าน</div>
        </div>
      </div>

      <div class="clock" id="clock">
        <span class="clock-date" id="clockDate">--/--/----</span>
        <span class="clock-time" id="clockTime">--:--:--</span>
      </div>

      <span class="net-badge" id="netBadge">Online</span>

      <div class="topbar-spacer"></div>

      <button class="hbtn" id="btnSync" type="button">
        <span data-icon="cloud"></span>
        <span id="syncLabel">Sync Pending (0)</span>
      </button>
      <button class="hbtn" id="btnStock" type="button">
        <span data-icon="box"></span>
        <span class="lbl-long">จัดการสต็อก &amp; รูปภาพ</span><span class="lbl-short">สต็อก</span>
      </button>
      <button class="hbtn" id="btnHistory" type="button">
        <span data-icon="receipt"></span>
        <span class="lbl-long">ประวัติบิล &amp; สรุปยอดขาย</span><span class="lbl-short">ประวัติบิล</span>
      </button>
      <button class="hbtn" id="btnSettings" type="button">
        <span data-icon="sliders"></span>
        <span class="lbl-long">ตั้งค่า / Sync</span><span class="lbl-short">ตั้งค่า</span>
      </button>
      <button class="hbtn hbtn-icon" id="btnUpdate" type="button" title="Update App Version" aria-label="Update App Version">
        <span data-icon="refresh"></span>
      </button>
    </header>

    <!-- ================= MAIN SPLIT ================= -->
    <main class="layout">
      <!-- Left 70%: menu -->
      <section class="menu-panel" aria-label="เมนู">
        <nav class="cat-tabs" id="catTabs"></nav>
        <div class="menu-grid" id="menuGrid"></div>
      </section>

      <!-- Right 30%: cart -->
      <aside class="cart-panel" aria-label="ตะกร้า">
        <div class="cart-head">
          <div class="cart-title"><span data-icon="cart"></span> ออเดอร์ปัจจุบัน <span class="cart-count" id="cartCount">0</span></div>
          <button class="btn-text" id="btnClearCart" type="button">ล้างตะกร้า</button>
        </div>

        <div class="cart-list" id="cartList"></div>

        <div class="cart-footer">
          <div class="sum-row">
            <span>ยอดรวมก่อนลด (Subtotal)</span>
            <span id="sumSubtotal">฿0</span>
          </div>
          <div id="promoRows"></div>
          <div class="sum-row manual-row">
            <label for="manualDiscount">ส่วนลดเพิ่มเติม (บาท)</label>
            <div class="manual-input-wrap">
              <span>฿</span>
              <input id="manualDiscount" class="manual-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" />
            </div>
          </div>
          <div class="manual-note" id="manualNote"></div>
          <div class="net-row">
            <span>ยอดชำระสุทธิ</span>
            <span class="net-amount" id="sumNet">฿0</span>
          </div>
          <button class="btn-checkout" id="btnCheckout" type="button" disabled>ยืนยันออเดอร์ / ชำระเงิน</button>
        </div>
      </aside>
    </main>
  </div>

  <!-- ================= MODALS ================= -->

  <!-- Cereal cookie: weight & giveaway -->
  <div class="modal" id="m-cereal" role="dialog" aria-modal="true">
    <div class="modal-card modal-lg">
      <div class="modal-head"><h2 class="modal-title"></h2><button class="modal-x" data-close type="button" aria-label="ปิด">&times;</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div>
    </div>
  </div>

  <!-- Gooey set builder -->
  <div class="modal" id="m-gooey" role="dialog" aria-modal="true">
    <div class="modal-card modal-lg">
      <div class="modal-head"><h2 class="modal-title">Gooey Chocolate + Ice Cream</h2><button class="modal-x" data-close type="button" aria-label="ปิด">&times;</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div>
    </div>
  </div>

  <!-- Payment -->
  <div class="modal" id="m-pay" role="dialog" aria-modal="true">
    <div class="modal-card modal-lg">
      <div class="modal-head"><h2 class="modal-title">ชำระเงิน</h2><button class="modal-x" data-close type="button" aria-label="ปิด">&times;</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div>
    </div>
  </div>

  <!-- Stock & images -->
  <div class="modal" id="m-stock" role="dialog" aria-modal="true">
    <div class="modal-card modal-xl">
      <div class="modal-head"><h2 class="modal-title">จัดการสต็อก &amp; รูปภาพ</h2><button class="modal-x" data-close type="button" aria-label="ปิด">&times;</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"><span class="foot-note">ระบบบันทึกอัตโนมัติทันทีที่แก้ไข</span><button class="btn btn-primary" data-close type="button">เสร็จสิ้น</button></div>
    </div>
  </div>

  <!-- History & summary -->
  <div class="modal" id="m-history" role="dialog" aria-modal="true">
    <div class="modal-card modal-xl">
      <div class="modal-head"><h2 class="modal-title">ประวัติบิล &amp; สรุปยอดขาย</h2><button class="modal-x" data-close type="button" aria-label="ปิด">&times;</button></div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Settings & sync -->
  <div class="modal" id="m-settings" role="dialog" aria-modal="true">
    <div class="modal-card modal-lg">
      <div class="modal-head"><h2 class="modal-title">ตั้งค่า / Google Sheets Sync</h2><button class="modal-x" data-close type="button" aria-label="ปิด">&times;</button></div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Generic confirm (stacks above other modals) -->
  <div class="modal modal-top" id="m-confirm" role="alertdialog" aria-modal="true">
    <div class="modal-card modal-sm">
      <div class="modal-head"><h2 class="modal-title cf-title">ยืนยัน</h2></div>
      <div class="modal-body cf-body"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost cf-cancel" type="button">ยกเลิก</button>
        <button class="btn btn-primary cf-ok" type="button">ยืนยัน</button>
      </div>
    </div>
  </div>

  <input type="file" id="imageInput" accept="image/*" hidden />
  <input type="file" id="importInput" accept="application/json,.json" hidden />
  <div id="toastHost" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
